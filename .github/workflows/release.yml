name: Release

on:
  push:
    branches: [Dev]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    # ... (Tag job remains the same as it does not use Gradle)
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.result }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next tag
        id: tag
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);

            const tags = await github.paginate(
              github.rest.repos.listTags,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const regex = new RegExp(`^(${yy}\\.([0-9]+))`);
            let max = 0;

            for (const tag of tags) {
              const match = tag.name.match(regex);
              if (match) {
                const n = parseInt(match[1].split('.')[1], 10);
                if (!Number.isNaN(n)) {
                  max = Math.max(max, n);
                }
              }
            }

            const next = max + 1;
            const nextTag = yy + '.' + next;

            console.log(`Next tag: ${nextTag}`);

            const exists = tags.some(t => t.name === nextTag);
            if (!exists) {
              try {
                await github.rest.git.createRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: 'refs/tags/' + nextTag,
                  sha: context.sha,
                });
                console.log(`Tag ${nextTag} created successfully.`);
              } catch (error) {
                if (error.status === 422) {
                  console.log(`Tag ${nextTag} already exists (possible race condition).`);
                } else {
                  throw error;
                }
              }
            } else {
              console.log(`Tag ${nextTag} already exists.`);
            }

            return nextTag;

  native:
    # ... (Native job remains the same as it uses CMake)
    runs-on: ubuntu-latest
    needs: tag
    env:
      ECHIDNA_VERSION: ${{ needs.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure DSP
        run: cmake -S native/dsp -B build/dsp -DCMAKE_BUILD_TYPE=Release

      - name: Build DSP
        run: cmake --build build/dsp --config Release

      - name: Configure Zygisk
        run: cmake -S native/zygisk -B build/zygisk -DCMAKE_BUILD_TYPE=Release

      - name: Build Zygisk
        run: cmake --build build/zygisk --config Release

      - name: Package native artifacts
        run: |
          mkdir -p artifacts/native
          cp build/dsp/lib/libech_dsp.so artifacts/native/libech_dsp.so
          cp build/zygisk/lib/libechidna.so artifacts/native/libechidna.so

      - name: Build Magisk module
        run: bash tools/build_magisk_module.sh

      - name: Collect Magisk module
        run: |
          mkdir -p artifacts/magisk
          cp out/echidna-magisk.zip artifacts/magisk/echidna-magisk.zip

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native
          path: artifacts/native

      - name: Upload Magisk module
        uses: actions/upload-artifact@v4
        with:
          name: magisk
          path: artifacts/magisk/echidna-magisk.zip

  android:
    runs-on: ubuntu-latest
    needs: tag
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Caching enabled by default in v4; problematic entries are handled internally now
          gradle-version: 8.5

      # We now run the commands via the shell, which is the new recommended practice.
      # This allows better visibility into the build steps and standardizes execution.
      - name: Build Android Modules
        run: |
          ./gradlew :app:assembleDebug
          ./gradlew :control-service:assembleDebug
          ./gradlew :lsposed-shim:assembleDebug
        working-directory: android

      - name: Package Android artifacts
        run: |
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/android/app-debug.apk
          cp android/control-service/build/outputs/aar/control-service-debug.aar \
            artifacts/android/control-service-debug.aar
          cp android/lsposed-shim/build/outputs/aar/lsposed-shim-debug.aar \
            artifacts/android/lsposed-shim-debug.aar

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/android

  publish:
    runs-on: ubuntu-latest
    needs: [tag, native, android]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          # This merges all artifacts into the workspace for release creation
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          files: |
            *.apk
            *.aar
            *.zip
            *.so
            
